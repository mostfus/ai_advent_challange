[project]
name = "day13-task-state-machine"
version = "0.1.0"
description = "An LLM agent whose tasks are an explicit state machine - four stages, a table of legal moves, a checklist per stage and a pause - over a three-layer memory model and a switchable personality, with a web GUI on top"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv==1.2.3",
    "uvicorn[standard]>=0.52.4",
]
