[project]
name = "day17-local-mcp-server"
version = "0.1.0"
description = "An LLM agent that calls tools on a local MCP server of its own over Google Maps, reads the tool catalogue off other people's MCP servers, will not break the rules you wrote down, whose tasks are an explicit state machine, over a three-layer memory model and a switchable personality, with a web GUI on top"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=1.12",
    "python-dotenv==1.2.3",
    "uvicorn[standard]>=0.52.4",
]
