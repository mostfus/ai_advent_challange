[project]
name = "day16-mcp-tool-list"
version = "0.1.0"
description = "An LLM agent that reads the tool catalogue off MCP servers over hand-written JSON-RPC, will not break the rules you wrote down, whose tasks are an explicit state machine, over a three-layer memory model and a switchable personality, with a web GUI on top"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv==1.2.3",
    "uvicorn[standard]>=0.52.4",
]
